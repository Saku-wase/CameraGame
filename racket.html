<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ラケット（スマホ）</title>
<style>
html,body{margin:0;height:100%;background:#10263a;color:#fff;font-family:system-ui,"Hiragino Sans",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px;box-sizing:border-box;transition:background .15s}
h1{margin:4px 0 0;font-size:22px}
#status{font-size:14px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.12)}
#status.ok{background:#1e8c3c}
#info{min-height:26px;font-size:17px;font-weight:700;text-align:center}
#score{font-size:14px;opacity:.85;min-height:18px}
#racket{font-size:96px;line-height:1;transition:transform .08s}
.lbl{font-size:12px;opacity:.8;margin-bottom:4px}
.bar{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
#pow{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4fd16b,#ffe14d,#ff5a3a)}
button{font-size:20px;font-weight:700;border:none;border-radius:12px;padding:14px 28px;background:#ff7a1a;color:#fff;width:100%;max-width:340px}
button.sub{background:rgba(255,255,255,.15);font-size:14px;padding:9px 6px;border-radius:10px}
select{font-size:16px;padding:6px;border-radius:8px}
#hint{font-size:13px;opacity:.75;text-align:center;line-height:1.6;max-width:340px}
.hidden{display:none!important}

#live{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:360px;flex:1}
.top{display:flex;gap:14px;width:100%;align-items:stretch}
/* 狙い：相手コートを上から見た図。上がベースライン（深い）、下がネット（浅い） */
#aimpad{position:relative;width:108px;height:146px;border:2px solid #fff;border-radius:4px;background:#2f63b0;flex:none}
#aimpad::before{content:"";position:absolute;left:0;right:0;top:45%;height:2px;background:rgba(255,255,255,.7)}
#aimpad::after{content:"NET";position:absolute;left:-2px;right:-2px;bottom:-14px;height:12px;border-top:4px solid #fff;font-size:9px;text-align:center;opacity:.8}
#aimdot{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#dfff4f;box-shadow:0 0 10px #dfff4f}
.side{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
/* 移動スティック */
#stick{position:relative;width:min(68vw,250px);height:min(68vw,250px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.18));border:2px solid rgba(255,255,255,.35);touch-action:none;margin-top:auto}
#stick::before{content:"移動";position:absolute;top:8px;width:100%;text-align:center;font-size:12px;opacity:.6}
#knob{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;background:#ff7a1a;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none}
details{width:100%;font-size:14px}
summary{opacity:.8;padding:4px 0}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:8px 0}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<h1 id="title">🎾 スマホラケット</h1>
<div id="status">接続中…</div>
<div id="racket">🎾</div>
<div id="info">下のボタンを押してね</div>
<div id="score"></div>

<button id="go">スタート（センサーON）</button>

<div id="live" class="hidden">
  <div class="top">
    <div>
      <div class="lbl">狙い（傾ける）</div>
      <div id="aimpad"><div id="aimdot"></div></div>
    </div>
    <div class="side">
      <div><div class="lbl">スイングの強さ</div><div class="bar"><div id="pow"></div></div></div>
      <button class="sub" id="view">👁 視点切替（一人称／三人称）</button>
      <button class="sub" id="calib">↺ 傾きの基準をリセット</button>
      <button class="sub" id="tap">タップでスイング（予備）</button>
    </div>
  </div>

  <div id="stick"><div id="knob"></div></div>

  <details>
    <summary>設定</summary>
    <div class="row">
      <label>振る強さ
        <select id="sens">
          <option value="0.45">軽く振る</option>
          <option value="0.75" selected>ふつう</option>
          <option value="1.1">しっかり振る</option>
        </select>
      </label>
      <label><input type="checkbox" id="flip"> 左右反転</label>
    </div>
    <div class="row">
      <label>振動
        <select id="vstr">
          <option value="1" selected>強</option>
          <option value="0.7">中</option>
          <option value="0.45">弱</option>
          <option value="0">なし</option>
        </select>
      </label>
      <label><input type="checkbox" id="cue"> 振りどきの合図</label>
    </div>
  </details>
</div>

<div id="hint">画面を自分に向けて縦に持ち、親指をスティックに置いてください。<br>
スティックで移動 → ボールが来たらスマホを振って打つ！<br>
左右に傾ける＝左右、奥に倒す＝深い球、手前に倒す＝浅い球。<br>
手からすっぽ抜けないよう、しっかり握ってね！</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hostId = new URLSearchParams(location.search).get('id');

// ---------- 接続 ----------
let peer = null, conn = null, retry = null;
function setStatus(text, ok) { $('status').textContent = text; $('status').classList.toggle('ok', !!ok); }
function send(o) { if (conn && conn.open) { try { conn.send(o); } catch (e) {} } }
function connect() {
  clearTimeout(retry);
  if (!hostId) { setStatus('PCの画面のQRコードから開いてください'); return; }
  if (typeof Peer === 'undefined') { setStatus('通信ライブラリを読み込めませんでした'); return; }
  if (!peer || peer.destroyed) {
    peer = new Peer();
    peer.on('open', connect);
    peer.on('error', e => { setStatus('接続エラー：' + e.type + '（再接続します）'); retry = setTimeout(connect, 2500); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    return;
  }
  if (!peer.open) return;
  const c = peer.connect(hostId, { serialization: 'json' });
  c.on('open', () => { conn = c; setStatus('✅ PCと接続中', true); if (started) { $('info').textContent = 'スティックで動いて、振って打とう！'; send({ t: 'start' }); } });
  c.on('data', onData);
  c.on('close', () => { if (conn === c) { conn = null; setStatus('切断されました（再接続中…）'); retry = setTimeout(connect, 2000); } });
}
connect();

function onData(d) {
  if (!d) return;
  if (d.t === 'hit') {
    haptic('hit', { q: d.q ?? 1, p: d.p ?? 0.6, o: d.o ?? 0.3 });
    if (!canVibrate) beep(d.q === 2 ? 1300 : 900);
    flash(d.q === 2 ? '#7a5a00' : '#1e6b35');
    $('info').textContent = ['ミスヒット…', 'ナイスショット！', 'パーフェクト！！'][d.q] || 'ヒット！';
  } else if (d.t === 'miss') {
    haptic('miss');
  } else if (d.t === 'fx') {
    if (d.kind === 'cue' && !$('cue').checked) return;
    haptic(d.kind);
  } else if (d.t === 'info') {
    if (d.ev) haptic(d.ev);
    $('info').textContent = d.text || '';
    if (d.score) $('score').textContent = d.score;
  } else if (d.t === 'state') {
    if (d.mode === 'result') { $('info').textContent = (d.text || '試合終了') + '　もう一度なら↓'; $('go').textContent = 'もう一度プレイ'; $('go').classList.remove('hidden'); }
    if (d.mode === 'play') { $('go').classList.add('hidden'); $('score').textContent = ''; }
  }
}

// ---------- 振動 ----------
// iPhoneアプリ版（ios/）の中では本体の振動機能（Core Haptics）を使い、
// Androidのブラウザでは Vibration API を使う。どちらも無いときは音で知らせる。
const nativeHaptic = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haptic;
const canVibrate = !!nativeHaptic || typeof navigator.vibrate === 'function';
// Android 用：強弱は指定できないので、長さと細かい断続（短く刻むほど弱く感じる）で表現する
const VIBE = {
  miss: [4, 14, 6, 14, 4],                         // 空気を切る「スッ」
  bounce: [8],                                     // 手前で弾む「トッ」
  net: [45],                                       // ネット「ボスッ」
  fault: [20, 130, 20],
  cue: [6],                                        // 振りどきの合図「チッ」
  win: [14, 90, 20, 55, 30, 20, 45],               // 間隔が詰まって強く
  lose: [110, 25, 55, 25, 25, 25, 10],             // しぼむ
  gameWin: [40, 90, 40, 90, 170],                  // タ・タ・ターン
  gameLose: [140, 160, 200],                       // ため息2回
  matchWin: [10, 40, 12, 38, 14, 34, 16, 30, 18, 26, 20, 22, 320],   // ドラムロール→フィニッシュ
  matchLose: [60, 120, 35, 600, 40, 120, 20],      // 弱まる鼓動
};
function hitPattern({ q, p, o }) {
  if (q === 2) return [16 + 10 * p, 45, 8];                    // 鋭い衝撃＋澄んだ反響
  if (q === 1) return o > 0.5 ? [14 + 14 * p + 20 * o, 30, 8]  // 少しフレームに掛かった
                              : [14 + 14 * p + 20 * o];
  return [28, 14, 10, 14, 7, 14, 4];                           // 鈍い当たり＋カタカタ
}
function vibeScale() { return +$('vstr').value; }
function haptic(kind, extra = {}) {
  const scale = vibeScale();
  if (scale <= 0) return;
  if (nativeHaptic) { try { nativeHaptic.postMessage({ kind, scale, ...extra }); } catch (e) {} return; }
  if (!navigator.vibrate) return;
  const pat = kind === 'hit' ? hitPattern(extra) : VIBE[kind];
  if (!pat) return;
  // 振動している区間（偶数番目）だけ強さの設定で短くする
  navigator.vibrate(pat.map((ms, i) => Math.round(i % 2 ? ms : Math.max(4, ms * scale))));
}

// ---------- 音・画面演出 ----------
let actx = null;
function beep(freq) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = freq; g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.13);
}
let flashT = null;
function flash(color) {
  document.body.style.background = color;
  clearTimeout(flashT); flashT = setTimeout(() => document.body.style.background = '', 180);
}

// ---------- 狙い（傾き） ----------
// x：左右に傾ける（gamma）、y：奥に倒すと深い球／手前に倒すと浅い球（beta の基準からの差）
let sensorsOn = false, betaNow = null, beta0 = null, calibPending = true;
let aimNow = { x: 0, y: 0 }, lastAimSent = 0, lastAimVal = { x: 9, y: 9 };
const aimHist = [];   // スイング直前の傾きを使うための履歴

function onOrient(e) {
  if (e.gamma == null || e.beta == null) return;
  betaNow = e.beta;
  if (calibPending) { beta0 = e.beta; calibPending = false; }
  let x = clamp(e.gamma / 35, -1, 1);
  if ($('flip').checked) x = -x;
  const y = clamp((beta0 - e.beta) / 25, -1, 1);   // 画面の上側を奥へ倒すと beta が小さくなる → 深い
  aimNow = { x, y };
  const t = performance.now();
  aimHist.push({ t, a: aimNow }); while (aimHist.length && t - aimHist[0].t > 600) aimHist.shift();
  $('aimdot').style.left = (50 + x * 44) + '%';
  $('aimdot').style.top = (50 - y * 42) + '%';
  if (t - lastAimSent > 66 && swingState === 0 &&
      (Math.abs(x - lastAimVal.x) > 0.02 || Math.abs(y - lastAimVal.y) > 0.02)) {
    lastAimSent = t; lastAimVal = aimNow; send({ t: 'aim', x, y });
  }
}
function aimBefore(ms) {
  const t = performance.now() - ms;
  for (let i = aimHist.length - 1; i >= 0; i--) if (aimHist[i].t <= t) return aimHist[i].a;
  return aimNow;
}

// ---------- スイング検出 ----------
let swingState = 0, peak = 0, riseT = 0, cool = 0;

async function enableSensors() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { $('info').textContent = 'モーションセンサーの許可が必要です'; return false; }
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  } catch (e) { $('info').textContent = 'センサーを有効にできませんでした：' + e.message; return false; }
  if (!sensorsOn) {
    addEventListener('devicemotion', onMotion);
    addEventListener('deviceorientation', onOrient);
    sensorsOn = true;
  }
  return true;
}

function onMotion(e) {
  const rr = e.rotationRate || {};
  const rot = Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0);
  let acc = 0;
  if (e.acceleration && e.acceleration.x != null) acc = Math.hypot(e.acceleration.x, e.acceleration.y, e.acceleration.z);
  else if (e.accelerationIncludingGravity) { const g = e.accelerationIncludingGravity; acc = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8); }
  const s = Math.max(rot / 400, acc / 20);
  const th = +$('sens').value;
  const t = performance.now();
  if (swingState === 0) {
    if (s > th && t > cool) { swingState = 1; peak = s; riseT = t; }
  } else {
    peak = Math.max(peak, s);
    if (s < peak * 0.8 || t - riseT > 80) {   // ピーク（＝インパクト）で送信
      swingState = 0; cool = t + 380;
      fire(0.2 + 0.8 * clamp((peak - th) / (th * 2), 0, 1));
    }
  }
}

function fire(power) {
  const a = aimBefore(180);   // 振り始める前の傾きで狙う
  send({ t: 'swing', p: power, a });
  $('pow').style.width = (power * 100) + '%';
}

// ---------- 移動スティック ----------
const stickEl = $('stick'), knob = $('knob');
let stickId = null, stickVec = { x: 0, y: 0 }, stickTimer = null;
function stickFrom(e) {
  const r = stickEl.getBoundingClientRect();
  const R = r.width / 2;
  let x = (e.clientX - (r.left + R)) / (R * 0.7);
  let y = (e.clientY - (r.top + R)) / (R * 0.7);
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  knob.style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`;
  const dead = 0.12;   // 親指を置いただけでは動かないように
  const mm = Math.hypot(x, y);
  const k = mm < dead ? 0 : (mm - dead) / (1 - dead) / mm;
  stickVec = { x: x * k, y: -y * k };   // 上に倒す＝前（ネット方向）
}
function sendStick() { send({ t: 'stick', x: +stickVec.x.toFixed(2), y: +stickVec.y.toFixed(2) }); }
stickEl.addEventListener('pointerdown', e => {
  if (stickId !== null) return;
  stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId);
  stickFrom(e); sendStick();
  clearInterval(stickTimer); stickTimer = setInterval(sendStick, 50);   // 押している間は送り続ける
  e.preventDefault();
});
stickEl.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickFrom(e); });
function stickEnd(e) {
  if (e.pointerId !== stickId) return;
  stickId = null; clearInterval(stickTimer);
  stickVec = { x: 0, y: 0 }; knob.style.transform = '';
  sendStick(); setTimeout(sendStick, 60);   // 止まる合図は念のため2回
}
stickEl.addEventListener('pointerup', stickEnd);
stickEl.addEventListener('pointercancel', stickEnd);

// ---------- ボタン ----------
let wakeLock = null, started = false;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sensorsOn) keepAwake(); });

$('go').onclick = async () => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  actx?.resume?.();
  const ok = await enableSensors();
  started = true;
  calibPending = true;   // いまの持ち方を「まっすぐ」とする
  keepAwake();
  for (const id of ['title', 'racket', 'hint']) $(id).classList.add('hidden');
  $('live').classList.remove('hidden');
  $('go').classList.add('hidden');
  if (!conn) { $('info').textContent = 'PCとの接続を待っています…'; }
  else { $('info').textContent = ok ? 'スティックで動いて、振って打とう！' : 'タップでスイングできます'; }
  send({ t: 'start' });
};
$('tap').onclick = () => fire(0.6);
$('view').onclick = () => send({ t: 'view' });
$('calib').onclick = () => { calibPending = true; $('info').textContent = '今の持ち方を「まっすぐ」にしました'; };

// 設定を覚えておく（使えない環境でも動くように try で囲む）
for (const id of ['sens', 'flip', 'vstr', 'cue']) {
  const el = $(id), key = 'racket.' + id;
  try {
    const v = localStorage.getItem(key);
    if (v !== null) { if (el.type === 'checkbox') el.checked = v === '1'; else el.value = v; }
  } catch (e) {}
  el.addEventListener('change', () => {
    try { localStorage.setItem(key, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value); } catch (e) {}
    if (id === 'vstr') haptic('hit', { q: 2, p: 0.8, o: 0 });   // 強さを変えたらその場で確かめられる
  });
}
</script>
</body>
</html>
